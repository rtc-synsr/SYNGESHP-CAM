<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Politique de sécurité du contenu. En l'absence de toute CSP, la moindre bibliothèque
         tierce compromise pouvait exfiltrer en une requête le contenu du stockage local, qui
         contient données de santé, numéros de CNI, salaires et identifiants de connexion.
         'unsafe-inline' reste nécessaire pour style-src tant que la feuille GLOBAL_STYLE_CSS est
         injectée par un <style> et que les attributs style= inline subsistent.
         frame-ancestors et X-Frame-Options ne sont pas interprétés dans une balise meta : les
         reprendre en en-têtes HTTP côté hébergeur, avec :
           X-Content-Type-Options: nosniff
           Referrer-Policy: strict-origin-when-cross-origin
           Strict-Transport-Security: max-age=31536000; includeSubDomains
           Permissions-Policy: geolocation=(self), camera=(), microphone=()
           Content-Security-Policy: frame-ancestors 'none' -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self'
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>SYNGESHP-CAM — Système Numérique de Gestion Hospitalière et de Planification du Cameroun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
